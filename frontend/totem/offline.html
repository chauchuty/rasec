<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b09">
  <title>RASEC Espetinhos — Offline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <div class="tela-offline">
      <div>
        <div style="font-size:72px; margin-bottom:12px">🍢</div>
        <h1 class="grito" style="display:inline-block; background:var(--vermelho); color:var(--creme);
          font-family:var(--fonte-impacto); padding:10px 22px; transform:skew(-6deg)">
          SEM CHAMA AGORA!
        </h1>
        <p style="margin-top:18px; color:var(--creme-quente)">
          A brasa esfriou — você está sem internet.<br>
          Seus pedidos anteriores continuam salvos no aparelho.
        </p>
        <button class="btn btn-creme" style="margin-top:22px" onclick="location.reload()">
          Tentar de novo 🔥
        </button>
      </div>
    </div>
  </main>
</body>
</html>
